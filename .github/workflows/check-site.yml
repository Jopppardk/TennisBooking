name: Tjek domæne

# Run by hand to see how the site answers from the internet: DNS, certificate and HTTP status for each address.
on:
  workflow_dispatch:
    inputs:
      hosts:
        description: Adresser (adskilt af mellemrum)
        default: ambabooking.dk www.ambabooking.dk tennis-booking.rene-jeppesen.workers.dev
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env:
          HOSTS: ${{ inputs.hosts }}
        run: |
          for h in $HOSTS; do
            echo "=== $h"
            echo "NS:    $(dig +short NS "${h#www.}" | tr '\n' ' ')"
            echo "A:     $(dig +short A "$h" @1.1.1.1 | tr '\n' ' ')"
            echo "AAAA:  $(dig +short AAAA "$h" @1.1.1.1 | tr '\n' ' ')"
            echo "CNAME: $(dig +short CNAME "$h" @1.1.1.1 | tr '\n' ' ')"
            curl -sS -o /tmp/body -m 20 -w "HTTPS: %{http_code} -> %{redirect_url}\n" "https://$h/" || echo "HTTPS failed"
            echo "Title: $(grep -o '<title>[^<]*' /tmp/body 2>/dev/null | head -1)"
            echo | openssl s_client -connect "$h:443" -servername "$h" 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "No certificate"
          done
