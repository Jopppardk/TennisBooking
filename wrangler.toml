name = "tennis-booking"
main = "src/index.js"
compatibility_date = "2025-09-01"

# CSS, JS and icon from public/ are served directly by Cloudflare.
[assets]
directory = "./public"

# Create the database once with:  npx wrangler d1 create tennis-booking
# then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "tennis-booking"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   ADMIN_PIN        PIN for the first administrator (member no. 1); default 1234
#   RESEND_API_KEY   e-mail via resend.com
#   MAIL_FROM        sender, e.g. "Tennisklubben <booking@dinklub.dk>" (a domain verified in Resend)
#   CPSMS_USERNAME   SMS via cpsms.dk
#   CPSMS_APIKEY
