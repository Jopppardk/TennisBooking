name = "tennis-booking"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

# The site answers on ambabooking.dk and www.ambabooking.dk (the zone is on the same Cloudflare account).
routes = [
  { pattern = "ambabooking.dk", custom_domain = true },
  { pattern = "www.ambabooking.dk", custom_domain = true },
]

# CSS, JS and icon from public/ are served directly by Cloudflare.
[assets]
directory = "./public"

# Create the database once with:  npx wrangler d1 create tennis-booking
# then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "tennis-booking"
database_id = "e2fbfbc4-b108-45b3-9e90-80c02851084a"
migrations_dir = "migrations"

[observability]
enabled = true

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   ADMIN_PIN        optional: creates an administrator (member ADMIN_MEMBER_NO, default 1) when none exists
#   BREVO_API_KEY    e-mail via brevo.com (sender = the contact e-mail in Administration, verified in Brevo)
#   RESEND_API_KEY   or e-mail via resend.com (needs your own domain)
#   MAIL_FROM        optional sender, e.g. "Tvis Tennis <booking@dinklub.dk>"; overrides the contact e-mail
